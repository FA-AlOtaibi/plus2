name: SocialStudio
options:
  bundleIdPrefix: com.fahad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_NAME: SocialStudio
targets:
  SocialStudio:
    type: application
    platform: iOS
    sources:
      - path: SocialStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fahad.sardstudio
        INFOPLIST_FILE: SocialStudio/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
